spring:
  application:
    name: receta-servicio-test

  datasource:
    url: jdbc:mariadb://localhost:3307/veterinaria_db_test
    username: root
    password: root123
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com:
      vidaysalud:
        veterinaria: INFO

servicios:
  cliente:
    url: http://localhost:8081
  mascota:
    url: http://localhost:8082
  veterinario:
    url: http://localhost:8083
  cita:
    url: http://localhost:8084
  consulta:
    url: http://localhost:8085/api/v1/consultas
  medicamento:
    url: http://localhost:8086/api/v1/medicamentos
  receta:
    url: http://localhost:8087
  inventario:
    url: http://localhost:8088
  pago:
    url: http://localhost:8089
  notificacion:
    url: http://localhost:8090