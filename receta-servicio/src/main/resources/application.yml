spring:
  application:
    name: receta-servicio

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/veterinaria_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com:
      vidaysalud:
        veterinaria: INFO

servicios:
  cliente:
    url: http://localhost:8081
  mascota:
    url: http://localhost:8082
  veterinario:
    url: http://localhost:8083
  cita:
    url: http://localhost:8084
  consulta:
    url: ${CONSULTA_URL:http://localhost:8085/api/v1/consultas}
  medicamento:
    url: ${MEDICAMENTO_URL:http://localhost:8086/api/v1/medicamentos}
  receta:
    url: http://localhost:8087
  inventario:
    url: http://localhost:8088
  pago:
    url: http://localhost:8089
  notificacion:
    url: http://localhost:8090