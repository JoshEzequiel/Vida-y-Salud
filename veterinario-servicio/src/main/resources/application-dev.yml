spring:
  application:
    name: veterinario-servicio

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/veterinaria_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com:
      vidaysalud:
        veterinaria: INFO